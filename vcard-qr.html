<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact QR Code Generator – vCard QR</title>

  <meta name="description" content="Generate vCard QR code to share contact details instantly." />
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="container nav">
    <a href="index.html" class="logo">QR<span>Tools</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#tools">Tools</a>
    </nav>
  </div>
</header>

<!-- GENERATOR -->
<section class="generator">
  <div class="container">

    <h1>Contact (vCard) QR Code Generator</h1>
    <p>Create a QR code to instantly save contact details.</p>

    <div class="generator-box">

      <input type="text" id="name" placeholder="Full Name *" />
      <input type="tel" id="phone" placeholder="Phone Number" />
      <input type="email" id="email" placeholder="Email Address" />
      <input type="text" id="company" placeholder="Company (optional)" />

      <button onclick="generateVCardQR()">Generate QR Code</button>

      <div id="qrResult" class="qr-result"></div>

      <button
        id="downloadBtn"
        class="download-btn"
        onclick="downloadQR()"
        style="display:none"
      >
        Download QR Code
      </button>

    </div>

  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <p>© 2026 QRTools. All rights reserved.</p>
  </div>
</footer>

<!-- SCRIPT -->
<script>
let currentQRUrl = "";

function generateVCardQR() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const company = document.getElementById("company").value.trim();

  if (!name) {
    alert("Please enter full name");
    return;
  }

  let vCard =
    "BEGIN:VCARD\n" +
    "VERSION:3.0\n" +
    "FN:" + name + "\n";

  if (company) vCard += "ORG:" + company + "\n";
  if (phone) vCard += "TEL;TYPE=CELL:" + phone + "\n";
  if (email) vCard += "EMAIL:" + email + "\n";

  vCard += "END:VCARD";

  currentQRUrl =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(vCard);

  document.getElementById("qrResult").innerHTML =
    `<img id="qrImg" src="${currentQRUrl}" crossorigin="anonymous" alt="Contact QR Code">`;

  document.getElementById("downloadBtn").style.display = "inline-block";
}

function downloadQR() {
  const img = document.getElementById("qrImg");
  if (!img) return;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  ctx.drawImage(img, 0, 0);

  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png");
  link.download = "contact-qr.png";
  link.click();
}
</script>

</body>
</html>
