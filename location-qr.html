<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Location QR Code Generator – Google Maps</title>

  <meta name="description" content="Generate location QR code instantly. Share Google Maps location with a QR code." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="container nav">
    <a href="index.html" class="logo">QR<span>Tools</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#tools">Tools</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<!-- GENERATOR -->
<section class="generator">
  <div class="container">

    <h1>Location QR Code Generator</h1>
    <p>Create a QR code that opens a Google Maps location.</p>

    <div class="generator-box">

      <input
        type="text"
        id="locationInput"
        placeholder="Enter address OR paste Google Maps link"
      />

      <button onclick="generateLocationQR()">Generate Location QR Code</button>

      <div id="qrResult" class="qr-result"></div>

      <button
        id="downloadBtn"
        class="download-btn"
        onclick="downloadQR()"
        style="display:none"
      >
        Download QR Code
      </button>

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <p>© 2026 QRTools. All rights reserved.</p>
  </div>
</footer>

<!-- SCRIPT -->
<script>
let currentQRUrl = "";

function generateLocationQR() {
  const location = document.getElementById("locationInput").value.trim();

  if (!location) {
    alert("Please enter a location or Google Maps link");
    return;
  }

  let mapsUrl;
  if (location.startsWith("http")) {
    mapsUrl = location;
  } else {
    mapsUrl =
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(location);
  }

  currentQRUrl =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(mapsUrl);

  document.getElementById("qrResult").innerHTML =
    `<img id="qrImg" src="${currentQRUrl}" crossorigin="anonymous" alt="Location QR Code">`;

  document.getElementById("downloadBtn").style.display = "inline-block";
}

function downloadQR() {
  const img = document.getElementById("qrImg");
  if (!img) return;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  ctx.drawImage(img, 0, 0);

  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png");
  link.download = "location-qr.png";
  link.click();
}
</script>

</body>
</html>
