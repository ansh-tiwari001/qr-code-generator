<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom QR Code Generator</title>

  <meta name="description" content="Create custom QR codes with custom colors and size. Free QR generator tool." />
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="container nav">
    <a href="index.html" class="logo">QR<span>Tools</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#tools">Tools</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<!-- GENERATOR -->
<section class="generator">
  <div class="container">

    <h1>Custom QR Code Generator</h1>
    <p>Create a QR code with custom colors and size.</p>

    <div class="generator-box">

      <input
        type="text"
        id="textInput"
        placeholder="Enter text or URL"
      />

      <label>QR Color</label>
      <input type="color" id="qrColor" value="#000000" />

      <label>Background Color</label>
      <input type="color" id="bgColor" value="#ffffff" />

      <label>Size</label>
      <select id="qrSize">
        <option value="200x200">Small</option>
        <option value="300x300" selected>Medium</option>
        <option value="400x400">Large</option>
      </select>

      <button onclick="generateCustomQR()">Generate QR Code</button>

      <div id="qrResult" class="qr-result"></div>

      <button
        id="downloadBtn"
        class="download-btn"
        onclick="downloadQR()"
        style="display:none"
      >
        Download QR Code
      </button>

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <p>© 2026 QRTools. All rights reserved.</p>
  </div>
</footer>

<!-- SCRIPT -->
<script>

let currentQRUrl = "";

function generateCustomQR() {

  const text = document.getElementById("textInput").value.trim();
  const qrColor = document.getElementById("qrColor").value.substring(1);
  const bgColor = document.getElementById("bgColor").value.substring(1);
  const size = document.getElementById("qrSize").value;

  if (!text) {
    alert("Please enter text or URL");
    return;
  }

  currentQRUrl =
    "https://api.qrserver.com/v1/create-qr-code/?size=" +
    size +
    "&color=" + qrColor +
    "&bgcolor=" + bgColor +
    "&data=" + encodeURIComponent(text);

  document.getElementById("qrResult").innerHTML =
    `<img id="qrImg" src="${currentQRUrl}" crossorigin="anonymous" alt="Custom QR Code">`;

  document.getElementById("downloadBtn").style.display = "inline-block";
}

function downloadQR() {

  const img = document.getElementById("qrImg");
  if (!img) return;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  ctx.drawImage(img, 0, 0);

  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png");
  link.download = "custom-qr.png";
  link.click();
}

</script>

</body>
</html>
