<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Custom QR Code Generator</title>

<meta name="description" content="Create custom QR codes with custom colors and size. Free QR generator tool." />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family: 'Inter', sans-serif;
  background:#f4f6f9;
  margin:0;
}

.generator{
  padding:60px 20px;
  text-align:center;
}

.generator-box{
  background:white;
  max-width:500px;
  margin:auto;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

input, select{
  width:100%;
  padding:12px;
  margin:10px 0 20px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
  font-size:14px;
}

.generate-btn{
  background:#7b2ff7;
  color:white;
}

.download-btn{
  background:#111;
  color:white;
  display:none;
}

.qr-result{
  margin-top:25px;
  padding:20px;
  background:white;
  border-radius:20px;
  display:inline-block;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<section class="generator">
<div class="container">

<h1>Custom QR Code Generator</h1>
<p>Create a QR code with custom colors and size.</p>

<div class="generator-box">

<input type="text" id="textInput" placeholder="Enter text or URL" />

<label>QR Color</label>
<input type="color" id="qrColor" value="#000000" />

<label>Background Color</label>
<input type="color" id="bgColor" value="#ffffff" />

<label>Size</label>
<select id="qrSize">
<option value="200x200">Small</option>
<option value="300x300" selected>Medium</option>
<option value="400x400">Large</option>
</select>

<button class="generate-btn" onclick="generateCustomQR()">Generate QR Code</button>

<div id="qrResult" class="qr-result"></div>

<button id="downloadBtn" class="download-btn" onclick="downloadQR()">Download QR Code</button>

</div>
</div>
</section>

<script>
let currentQRUrl = "";

function generateCustomQR() {
  const text = document.getElementById("textInput").value.trim();
  const qrColor = document.getElementById("qrColor").value.substring(1);
  const bgColor = document.getElementById("bgColor").value.substring(1);
  const size = document.getElementById("qrSize").value;

  if (!text) {
    alert("Please enter text or URL");
    return;
  }

  currentQRUrl =
    "https://api.qrserver.com/v1/create-qr-code/?size=" +
    size +
    "&color=" + qrColor +
    "&bgcolor=" + bgColor +
    "&data=" + encodeURIComponent(text);

  document.getElementById("qrResult").innerHTML =
    `<img id="qrImg" src="${currentQRUrl}" crossorigin="anonymous" alt="Custom QR Code">`;

  document.getElementById("downloadBtn").style.display = "inline-block";
}

function downloadQR() {
  const img = document.getElementById("qrImg");
  if (!img) return;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  ctx.drawImage(img, 0, 0);

  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png");
  link.download = "custom-qr.png";
  link.click();
}
</script>

</body>
</html>
