<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp QR Code Generator – Free Tool</title>

  <meta name="description" content="Generate WhatsApp QR code instantly. Start WhatsApp chat without saving number." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="container nav">
    <a href="index.html" class="logo">QR<span>Tools</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#tools">Tools</a>
    </nav>
  </div>
</header>

<!-- GENERATOR -->
<section class="generator">
  <div class="container">

    <h1>WhatsApp QR Code Generator</h1>
    <p>Generate a QR code to start WhatsApp chat instantly.</p>

    <div class="generator-box">

      <input
        type="tel"
        id="phone"
        placeholder="Phone number with country code (e.g. 919876543210)"
      />

      <textarea
        id="message"
        placeholder="Optional message (Hello, I want to contact you)"
        rows="3"
      ></textarea>

      <button onclick="generateWhatsAppQR()">Generate WhatsApp QR Code</button>

      <div id="qrResult" class="qr-result"></div>

      <button
        id="downloadBtn"
        class="download-btn"
        onclick="downloadQR()"
        style="display:none"
      >
        Download QR Code
      </button>

    </div>

  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <p>© 2026 QRTools. All rights reserved.</p>
  </div>
</footer>

<!-- SCRIPT -->
<script>
let currentQRUrl = "";

function generateWhatsAppQR() {
  const phone = document.getElementById("phone").value.trim();
  const message = document.getElementById("message").value.trim();

  if (!phone) {
    alert("Please enter phone number with country code");
    return;
  }

  const waLink =
    "https://wa.me/" + phone +
    (message ? "?text=" + encodeURIComponent(message) : "");

  currentQRUrl =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(waLink);

  document.getElementById("qrResult").innerHTML =
    `<img id="qrImg" src="${currentQRUrl}" crossorigin="anonymous" alt="WhatsApp QR Code">`;

  document.getElementById("downloadBtn").style.display = "inline-block";
}

function downloadQR() {
  const img = document.getElementById("qrImg");
  if (!img) return;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  ctx.drawImage(img, 0, 0);

  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png");
  link.download = "whatsapp-qr.png";
  link.click();
}
</script>

</body>
</html>
